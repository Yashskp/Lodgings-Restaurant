<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User | Lodgings & Restaurant Management</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="dashboard narrow-dashboard">
    <header class="dashboard-header">
        <div>
            <p class="eyebrow">Admin Control</p>
            <h1>Edit User</h1>
            <p class="muted">Update account details and role access.</p>
        </div>
        <a class="text-button" th:href="@{/admin/users}">Back to users</a>
    </header>

    <section class="auth-card edit-card">
        <form th:action="@{/admin/users/{id}/edit(id=${userId})}" th:object="${userEditForm}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="fullName">Full name</label>
            <input id="fullName" th:field="*{fullName}" type="text" required autofocus>
            <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>

            <label for="email">Email address</label>
            <input id="email" th:field="*{email}" type="email" required>
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <label for="role">Role</label>
            <select id="role" th:field="*{role}" required>
                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}">CUSTOMER</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>

            <button type="submit">Save changes</button>
        </form>
    </section>
</main>
</body>
</html>
